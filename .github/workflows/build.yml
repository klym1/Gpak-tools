name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    # System.Drawing / WinForms require Windows on modern .NET
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/GPExtractor.sln -c Release
      - run: dotnet test src/GPExtractor.sln -c Release --no-build
