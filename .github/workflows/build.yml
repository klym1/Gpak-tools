name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Avalonia's Skia renderer needs fontconfig on Linux (usually preinstalled).
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y libfontconfig1
      - run: dotnet build src/GPExtractor.sln -c Release
      # ViewerTests run the Avalonia viewer headlessly, so no display is needed.
      - run: dotnet test src/GPExtractor.sln -c Release --no-build
